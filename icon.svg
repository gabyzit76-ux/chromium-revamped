<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Glowing Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Core Element Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Shadow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Circle / Background Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#334155" stroke-width="4" opacity="0.5"/>

  <!-- Outer Tech Orbit Lines -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ringGrad)" stroke-width="6" stroke-dasharray="20 10 35 15" opacity="0.4"/>

  <!-- Main Revamped Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ringGrad)" stroke-width="24" filter="url(#glow)"/>

  <!-- Stylized Aperture / Blades (Chromium Motif Redesign) -->
  <g transform="rotate(25 256 256)">
    <!-- Segment 1 -->
    <path d="M 256,106 A 150,150 0 0,1 385,180 L 320,218 A 75,75 0 0,0 256,181 Z" fill="url(#ringGrad)" opacity="0.9"/>
    <!-- Segment 2 -->
    <path d="M 256,106 A 150,150 0 0,1 385,180 L 320,218 A 75,75 0 0,0 256,181 Z" fill="url(#ringGrad)" opacity="0.9" transform="rotate(120 256 256)"/>
    <!-- Segment 3 -->
    <path d="M 256,106 A 150,150 0 0,1 385,180 L 320,218 A 75,75 0 0,0 256,181 Z" fill="url(#ringGrad)" opacity="0.9" transform="rotate(240 256 256)"/>
  </g>

  <!-- Central Energy Core -->
  <circle cx="256" cy="256" r="64" fill="url(#coreGrad)" filter="url(#glow)"/>

  <!-- Lightning / Revamped Bolt Overlay -->
  <path d="M 266,210 L 240,250 L 258,250 L 246,302 L 276,258 L 256,258 Z" fill="#FFFFFF"/>
</svg>
