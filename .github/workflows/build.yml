name: Compile Revamp Stable APK (Max Resources)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize build space (Full Allocation)
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'false'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker: 'true'
          remove-large-packages: 'true'

      - name: Install Depot Tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> $GITHUB_PATH

      - name: Fetch Chromium Source
        run: |
          mkdir chromium && cd chromium
          fetch --nohooks --no-history --no-tags android

      - name: Config GClient for Android (Max Parallelism)
        run: |
          cd chromium
          echo "target_os = ['android']" >> .gclient
          gclient sync --with_branch_heads --with_tags --jobs=32

      - name: Install Build Dependencies
        run: |
          cd chromium/src
          sudo ./build/install-build-deps-android.sh --no-prompt

      - name: Rename App to Revamp Safely
        run: |
          cd chromium/src
          if [ -f "chrome/android/java/strings/android_chrome_strings.grd" ]; then
            sed -i 's/>Chromium</>Revamp</g' chrome/android/java/strings/android_chrome_strings.grd
          fi

      - name: Generate GN Args (Stable)
        run: |
          cd chromium/src
          gn gen out/Default --args='
            target_os = "android"
            target_cpu = "arm64"
            is_debug = false
            is_component_build = false
            symbol_level = 0
            enable_nacl = false
          '

      - name: Compile Stable APK (All Cores / Autoninja)
        run: |
          cd chromium/src
          autoninja -C out/Default monochrome_public_apk

      - name: Prepare APK for Upload
        run: |
          cd chromium/src/out/Default/apks
          # Renomeia o APK gerado para Revamp.apk para facilitar na hora de baixar
          mv MonochromePublic.apk Revamp.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Revamp-Stable-APK
          path: chromium/src/out/Default/apks/Revamp.apk
          
