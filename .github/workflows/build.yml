name: Build Revamp Browser

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: 1. Clonar Repositório
        uses: actions/checkout@v4

      - name: 2. Faxina no Disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          sudo docker system prune -a --volumes -f
          sudo apt-get clean
          sudo apt-get purge -y azure-cli google-cloud-cli google-chrome-stable microsoft-edge-stable firefox powershell || true
          df -h

      - name: 3. Instalar Dependências Essenciais
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git python3 python3-pip lsb-release sudo tzdata build-essential ninja-build

      - name: 4. Instalar Depot Tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git ~/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: 5. Configurar Git
        run: |
          git config --global user.name "Revamp Builder"
          git config --global user.email "builder@revamp.local"

      - name: 6. Baixar Código-Fonte (Shallow)
        run: |
          mkdir -p ~/chromium-revamped
          cd ~/chromium-revamped
          fetch --nohooks --no-history android

      - name: 7. Sincronizar Dependências
        run: |
          cd ~/chromium-revamped
          gclient sync --no-history --shallow --jobs 16 --nohooks
          gclient runhooks

      - name: 8. Aplicar Marca Revamp Browser
        run: |
          cd ~/chromium-revamped/src
          sed -i 's/<string name="app_name">Chromium<\/string>/<string name="app_name">Revamp Browser<\/string>/g' chrome/android/java/res/values/channel_constants.xml || true
          sed -i 's/<string name="app_name_beta">Chromium Beta<\/string>/<string name="app_name_beta">Revamp Browser<\/string>/g' chrome/android/java/res/values/channel_constants.xml || true

      - name: 9. Injetar Ícones (Se Existirem)
        run: |
          cd ~/chromium-revamped/src
          RESOURCE_DIR="chrome/android/java/res_chromium_beta"
          if [ -d "$GITHUB_WORKSPACE/meus_icones/res" ]; then
            cp -rf "$GITHUB_WORKSPACE/meus_icones/res/"* "$RESOURCE_DIR/" || true
          fi

      - name: 10. Redirecionar Nova Guia
        run: |
          cd ~/chromium-revamped/src
          sed -i 's|chrome://newtab/|https://google.com|g' chrome/android/java/src/org/chromium/chrome/browser/ntp/NewTabPage.java || true

      - name: 11. Gerar args.gn Enxuto
        run: |
          cd ~/chromium-revamped/src
          mkdir -p out/Default
          cat << 'ARG_EOF' > out/Default/args.gn
          target_os = "android"
          target_cpu = "arm64"
          is_debug = false
          is_component_build = false
          symbol_level = 0
          enable_nacl = false
          optimize_for_speed = true
          blink_symbol_level = 0
          disable_fieldtrial_testing_config = true
          exclude_unwind_tables = true
          enable_remoting = false
          enable_media_router = false
          enable_print_preview = false
          enable_swiftshader = false
          use_qt = false
          enable_extensions = false
          enable_pdf = false
          enable_plugins = false
          enable_reading_list = false
          enable_supervised_users = true
          enable_gcode = false
          enable_feed_v2 = false
          enable_lens_desktop_google_brand_results = false
          use_custom_libcxx = false
          enable_metrics_reporting = false
          chrome_pgo_phase = 0
          metrics_default_enable = false
          enable_library_cdms = false
          official_build = true
          chrome_public_manifest_package = "org.chromium.chrome.beta"
          enable_subresource_filter = true
          ARG_EOF

      - name: 12. Processar com GN
        run: |
          cd ~/chromium-revamped/src
          gn gen out/Default

      - name: 13. Compilar APK com Ninja
        run: |
          cd ~/chromium-revamped/src
          ninja -C out/Default chrome_public_apk

      - name: 14. Enviar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: RevampBrowser-APK
          path: ~/chromium-revamped/src/out/Default/apks/ChromePublic.apk
          
