name: Compile Revamp

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 10240
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Depot Tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> $GITHUB_PATH

      - name: Fetch Chromium Source (Fast / Shallow)
        run: |
          mkdir chromium && cd chromium
          fetch --nohooks --no-history --no-tags chromium

      - name: Install Build Dependencies
        run: |
          cd chromium/src
          sudo ./build/install-build-deps.sh --no-prompt --no-syms

      - name: Run GClient Hooks
        run: |
          cd chromium/src
          gclient runhooks --jobs=16

      - name: Rename Chromium to Revamp
        run: |
          cd chromium/src
          if [ -f "chrome/app/chromium_strings.grd" ]; then
            sed -i 's/<message name="IDS_PRODUCT_NAME" desc="The name of the application">Chromium<\/message>/<message name="IDS_PRODUCT_NAME" desc="The name of the application">Revamp<\/message>/g' chrome/app/chromium_strings.grd
          fi

      - name: Generate GN Args
        run: |
          cd chromium/src
          gn gen out/Default --args='
            is_debug = false
            is_component_build = false
            symbol_level = 0
            enable_nacl = false
            enable_remoting = false
            enable_vr = false
          '

      - name: Compile Revamp (Autoninja)
        run: |
          cd chromium/src
          autoninja -C out/Default chrome

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Revamp-Binary-Linux
          path: chromium/src/out/Default/chrome
          
