name: Build GoogleOS 17 GSI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximizar Espaço em Disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean

      - name: Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf lib32ncurses5-dev lib32z1-dev \
            libc6-dev libcap-dev libexpat1-dev libgl1-mesa-dev libgmp-dev libmpc-dev \
            libmpfr-dev libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 android-sdk-platform-tools simg2img

      - name: Baixar 'repo'
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sincronizar Fonte Base GSI
        run: |
          mkdir -p ~/gsi
          cd ~/gsi
          repo init -u https://github.com/TrebleDroid/platform_manifest.git -b android-13.0 --depth=1
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc)

      - name: Alterar Versão e Nome Direto no Core da Build
        run: |
          cd ~/gsi

          # 1. Modifica o BUILD_ID e nome do SO no sistema core
          echo "BUILD_ID=GOOGLEOS17" > build/make/core/build_id.mk

          # 2. Força a versão do Android no Makefile principal
          sed -i 's/PLATFORM_VERSION_CODENAME := .*/PLATFORM_VERSION_CODENAME := REL/g' build/make/core/version_defaults.mk
          sed -i 's/PLATFORM_VERSION := .*/PLATFORM_VERSION := 17/g' build/make/core/version_defaults.mk
          sed -i 's/PLATFORM_SDK_VERSION := .*/PLATFORM_SDK_VERSION := 36/g' build/make/core/version_defaults.mk

          # 3. Altera a marca e o modelo exibidos nativamente
          sed -i 's/PRODUCT_BRAND := .*/PRODUCT_BRAND := Google/g' build/make/target/product/full_base.mk
          sed -i 's/PRODUCT_NAME := .*/PRODUCT_NAME := GoogleOS_17/g' build/make/target/product/full_base.mk
          sed -i 's/PRODUCT_DEVICE := .*/PRODUCT_DEVICE := GoogleOS/g' build/make/target/product/full_base.mk

          # 4. Injeta Overrides das propriedades direto no makefile de system/core
          echo 'PRODUCT_PROPERTY_OVERRIDES += \' >> build/make/target/product/full_base.mk
          echo '    ro.build.version.release=17 \' >> build/make/target/product/full_base.mk
          echo '    ro.build.version.release_or_codename=17 \' >> build/make/target/product/full_base.mk
          echo '    ro.build.display.id=GoogleOS 17 (Pixel Edition) \' >> build/make/target/product/full_base.mk
          echo '    ro.config.marketing_name=GoogleOS 17' >> build/make/target/product/full_base.mk

      - name: Compilar GSI
        run: |
          cd ~/gsi
          source build/envsetup.sh
          lunch treble_arm64_bgN-userdebug
          make systemimage -j$(nproc)

      - name: Compactar Imagem Final
        run: |
          cd ~/gsi/out/target/product/phong/
          img2simg system.img GoogleOS_17_arm64_bgN.img
          xz -z -3 GoogleOS_17_arm64_bgN.img

      - name: Enviar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoogleOS-17-GSI
          path: ~/gsi/out/target/product/phong/GoogleOS_17_arm64_bgN.img.xz
