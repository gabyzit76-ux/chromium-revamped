name: Build Revamp Konsole GUI (Unificado & Boot Auto)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Repositório do Workflow
        uses: actions/checkout@v4

      - name: 2. Clonar Base Oficial Mais Recente do Termux App
        run: |
          git clone --depth 1 https://github.com/termux/termux-app.git ~/termux-src

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Configurar Android SDK e NDK
        uses: android-actions/setup-android@v3

      - name: 5. Renomear Aplicação para Revamp Konsole GUI
        run: |
          cd ~/termux-src
          find app/src/main/res -name "strings.xml" -exec sed -i 's/<string name="app_name">Termux<\/string>/<string name="app_name">Revamp Konsole GUI<\/string>/g' {} + || true

      - name: 6. Injetar Ícones Personalizados Unificados
        run: |
          RESOURCE_DIR="$HOME/termux-src/app/src/main/res"
          if [ -d "$GITHUB_WORKSPACE/meus_icones/res" ]; then
            mkdir -p "$RESOURCE_DIR"
            cp -rf "$GITHUB_WORKSPACE/meus_icones/res/"* "$RESOURCE_DIR/"
          fi

      - name: 7. Baixar Alpine Linux (arm64) e Gerar Assets de Boot
        run: |
          ASSETS_DIR="$HOME/termux-src/app/src/main/assets"
          mkdir -p "$ASSETS_DIR"
          
          # Baixar rootfs do Alpine Linux arm64 oficial
          curl -Lo "$ASSETS_DIR/alpine-rootfs.tar.gz" https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/aarch64/alpine-minirootfs-3.20.0-aarch64.tar.gz

          # Copiar wallpaper do repositório se existir
          if [ -f "$GITHUB_WORKSPACE/meus_icones/wallpaper.jpg" ]; then
            cp "$GITHUB_WORKSPACE/meus_icones/wallpaper.jpg" "$ASSETS_DIR/wallpaper.jpg"
          fi

          # Criar o script principal de entrada (entrypoint.sh)
          cat << 'EOF' > "$ASSETS_DIR/entrypoint.sh"
#!/bin/sh

# 1. Encerrar instâncias anteriores ao abrir para garantir sessão limpa
pkill -9 -f "xorg|xfce|wayland|proot|zsh" > /dev/null 2>&1 || true

# 2. Instalação de utilitários no Alpine Linux na primeira inicialização
if [ ! -f "/usr/bin/xfce4-session" ]; then
  apk update && apk add --no-cache \
      zsh git github-cli curl wget sudo coreutils findutils grep bash nano tar \
      xorg-server xfce4 xfce4-terminal feh dbus mesa-dri-gallium \
      chromium nss freetype harfbuzz ca-certificates ttf-freefont
fi

# 3. Instalar Oh My Zsh caso não exista
if [ ! -d "$HOME/.oh-my-zsh" ]; then
  sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended || true
fi

# 4. Criar atalho desktop do Revamp Browser no XFCE
mkdir -p /usr/share/applications/
cat << 'DESK' > /usr/share/applications/revamp-browser.desktop
[Desktop Entry]
Version=1.0
Type=Application
Name=Revamp Browser
Comment=Navegador Oficial Revamp
Exec=am start -a android.intent.action.VIEW -d "https://google.com" org.chromium.chrome.beta
Icon=web-browser
Terminal=false
Categories=Network;WebBrowser;
DESK

# 5. Criar comando binário revamp-open
cat << 'CMD' > /usr/bin/revamp-open
#!/bin/sh
URL="$1"
[ -z "$URL" ] && URL="https://google.com"
am start -a android.intent.action.VIEW -d "$URL" org.chromium.chrome.beta > /dev/null 2>&1
CMD
chmod +x /usr/bin/revamp-open

# 6. Criar comando binário sudo para PRoot
cat << 'CMD' > /usr/bin/sudo
#!/bin/sh
if [ "$(id -u)" -eq 0 ]; then
  exec "$@"
else
  exec proot -0 "$@"
fi
CMD
chmod +x /usr/bin/sudo

# 7. Configuração do Shell Zsh
sed -i -e 's/root:\/bin\/ash/root:\/bin\/zsh/g' /etc/passwd || true

cat << 'RC' > ~/.zshrc
export TERM="xterm-256color"
export DISPLAY=:0
export CHROME_BIN="/usr/bin/chromium-browser"

alias open="revamp-open"
alias chrome="chromium-browser --headless --disable-gpu"
alias revamp="echo 'Revamp Konsole GUI | Integrated Ecosystem'"

PROMPT='%F{cyan}󰄛 revamp-gui%f:%F{yellow}%~%f %# '
RC

# 8. Iniciar o Servidor X11 / XFCE4 com Wallpaper
export DISPLAY=:0
export PULSE_SERVER=127.0.0.1

if [ -f "/data/data/com.termux/files/usr/share/wallpaper.jpg" ]; then
  feh --bg-fill /data/data/com.termux/files/usr/share/wallpaper.jpg &
fi

# Executa o ambiente gráfico diretamente sem intervenção manual
exec startxfce4
EOF
          chmod +x "$ASSETS_DIR/entrypoint.sh"

      - name: 8. Configurar Auto-Start Nativo no Shell Padrão do Termux
        run: |
          # Adiciona a chamada do script diretamente no bashrc do Termux para rodar ao abrir o APK
          TERMUX_BASHRC="$HOME/termux-src/app/src/main/assets/boot/boot.sh"
          mkdir -p "$HOME/termux-src/app/src/main/assets/boot"
          echo '#!/bin/sh' > "$TERMUX_BASHRC"
          echo 'exec sh /data/data/com.termux/files/usr/entrypoint.sh' >> "$TERMUX_BASHRC"
          chmod +x "$TERMUX_BASHRC"

      - name: 9. Aceitar Licenças do Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 10. Compilar APK Unificado com Gradle
        run: |
          cd ~/termux-src
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 11. Enviar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: RevampKonsoleGUI-APK
          path: ~/termux-src/app/build/outputs/apk/debug/*.apk
          
